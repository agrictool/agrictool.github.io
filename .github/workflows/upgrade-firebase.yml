name: Upgrade firebase

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade firebase and regenerate lockfile
        run: npm install firebase@^12

      - name: Type-check (nothing is committed if this fails)
        run: npx tsc -b

      - name: Commit updated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade firebase to v12" || echo "No changes"
          git push
